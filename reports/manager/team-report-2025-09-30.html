    .sub { color: var(--muted); font-size: 1rem; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); margin-top: 16px; }
    .card { grid-column: span 12; background: linear-gradient(180deg, var(--panel), var(--panel2)); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: 0 10px 20px rgba(0,0,0,.25), inset 0 0 0 1px rgba(255,255,255,.02); }

    .card h3 { margin: 0 0 8px; font-size: 1rem; color: #c7d2fe; }
    .mono { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 0.95rem; line-height: 1.6; }
    .note { color: var(--muted); font-size: .9rem; margin-top: -8px; margin-bottom: 12px; }
    .table { width:100%; border-collapse: collapse; }
    .table th, .table td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; }
    .table thead th { font-size:.8rem; text-transform:uppercase; color:var(--muted); }
    .table tbody tr:nth-child(odd) { background: var(--stripe); }
    .rt { text-align: right; }
    canvas { background: linear-gradient(180deg, #0f172a, #0e1525); border: 1px solid var(--border); border-radius: 12px; padding: 6px; }
    @media (min-width: 920px) { .span-6 { grid-column: span 6; } }

  const kpiLeaderboards = [];

  function makeChart(id, type, labels, data, label, isCurrency = false) {
    const el = document.getElementById(id);
    if (!el) return;
    new Chart(el.getContext('2d'), {
      type: type,
      data: {
        labels: labels,
        datasets: [{
          label: label,
          data: data,
          backgroundColor: chartColors,
          borderColor: 'rgba(255,255,255,0.1)',
          borderWidth: 1
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        plugins: {
          legend: { display: false },
          datalabels: {
            anchor: 'end',
            align: 'end',
            color: '#e5e7eb',
            formatter: (value) => isCurrency ? '£' + value.toLocaleString('en-GB') : value.toLocaleString('en-GB')
          }
        },
        scales: {
          x: {
            beginAtZero: true,
            ticks: { color: '#94a3b8' },
            grid: { color: 'rgba(255,255,255,0.05)' }
          },
          y: {
            ticks: { color: '#e5e7eb' },
            grid: { display: false }
          }
        }
      }
    });
  }

  kpiLeaderboards.forEach(kpi => {
    const chartId = 'chart-' + kpi.kpi_name.toLowerCase().replace(/\s+/g, '-');
    const isCurrency = kpi.kpi_name.toLowerCase().includes('revenue');
    
    // Map the ranked list from the LLM to get the correct order
    const labels = kpi.ranked_list.map(item => item.agent);
    const data = kpi.ranked_list.map(item => {
      const val = item.value.replace(/[£,]/g, '');
      return parseFloat(val) || 0;
    });

    makeChart(chartId, 'bar', labels, data, kpi.kpi_name, isCurrency);
  });
})();
